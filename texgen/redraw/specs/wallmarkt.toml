# 1750 Wallmarkt signs: white sans text on blue/red/green panels, rotated 90° (reads bottom-to-top, rot = 90).
# Two-line signs: the first reading line is the left column. Brand "Wallmarkt"/"Übercentre" and the logo are kept.
# Font Segoe UI Semibold, colour = median of the original white lettering (214,223,231). Erase: thin strokes →
# pull-push + grain sampled from a lettering-free part of the same panel.

[[texture]]
id = "1750"

# Snacks
[[texture.op]]
type = "erase"
region = { box = [22, 160, 46, 234] }
mask = { kind = "all", grow = 1, of = [ { kind = "luminance", min = 140 }, { kind = "saturation", max = 90 } ] }
method = "pullpush"
grain = { ref = [36, 151, 44, 167], sigma = 1.5, gain = 1.0, seed = 1751 }

[[texture.op]]
type = "text"
text = "Снеки"
font = "seguisb.ttf"
fit = "fit"
box = [27, 150, 43, 234]
rot = 90
colour = [214, 223, 231]

