# CATE logo -> КОТЭ. 1207 (512) is identical to the top-left 512x512 of atlas 0053 (offset 0,0).
# Four instances: hood (normal), under the cat (mirrored), side (vertical), door (mirrored).
# 0053 declares its use_group ops (stop, cate, …) in signs.toml.

[[group]]
id = "cate"
space = [512, 512]

[[group.member]]
id = "1207"

[[group.member]]
id = "0053"

# 1) hood, normal
[[group.op]]
type = "erase"
id = "hood"
region = { box = [131, 43, 240, 62] }
mask = { kind = "luminance", min = 72, grow = 2 }
method = "pullpush"
grain = { ref = [140, 30, 230, 40], sigma = 1.2, gain = 1.0, seed = 61 }

[[group.op]]
type = "text"
text = "КОТЭ"
font = "Tektur.ttf"
axes = { wght = 500 }
fit = "fill_box"
box = [134, 46, 236, 60]
colour = [173, 172, 181]

# 2) under the cat, mirrored
[[group.op]]
type = "erase"
id = "cat"
